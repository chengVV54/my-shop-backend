server:
  port: 8080

spring:
  application:
    name: my-shop-backend

  # 用户系统自行做 JWT 鉴权，不使用 Spring Security 的内置账号密码，
  # 关掉默认内存用户自动配置，避免启动时打印随机密码。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: "jdbc:mysql://localhost:3306/my_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
    username: shop
    password: shop123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 每次启动自动执行建表与初始化数据脚本（脚本本身幂等，可重复执行）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
      continue-on-error: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.myshop: info

# JWT 配置
# secret 优先取环境变量 JWT_SECRET，未设置时回落到下面的默认值（仅用于本地开发）。
# 生产环境务必通过环境变量注入，不要把真实密钥提交进仓库。
# 注意：HS256 要求密钥不少于 32 字节，太短会在启动时直接报错。
jwt:
  secret: ${JWT_SECRET:myShopSecretKeyForJwtTokenMustBeAtLeast32BytesLong123456}
  # 有效期，毫秒；604800000 = 7 天
  expiration: ${JWT_EXPIRATION:604800000}
